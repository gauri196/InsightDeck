services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insightdeck-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - FIREBASE_PROJECT_ID=insight-7171c
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - insightdeck_uploads:/app/uploads
      - insightdeck_outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - insightdeck-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:8000
        VITE_FIREBASE_API_KEY: AIzaSyAjWrYL_4qjs-zPHUMQNTeKfTn2VO1hwTI
        VITE_FIREBASE_AUTH_DOMAIN: insight-7171c.firebaseapp.com
        VITE_FIREBASE_PROJECT_ID: insight-7171c
        VITE_FIREBASE_STORAGE_BUCKET: insight-7171c.firebasestorage.app
        VITE_FIREBASE_MESSAGING_SENDER_ID: "1002718498127"
        VITE_FIREBASE_APP_ID: "1:1002718498127:web:1d001fb815f3097991493a"
    container_name: insightdeck-frontend
    ports:
      # Maps host port 5173 to Nginx port 80 inside container
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - insightdeck-net

volumes:
  insightdeck_uploads:
    driver: local
  insightdeck_outputs:
    driver: local

networks:
  insightdeck-net:
    driver: bridge
