services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insightdeck-backend-dev
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - FIREBASE_PROJECT_ID=insight-7171c
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - insightdeck-dev-net

  frontend:
    image: node:20-alpine
    container_name: insightdeck-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - insightdeck-dev-net

networks:
  insightdeck-dev-net:
    driver: bridge
